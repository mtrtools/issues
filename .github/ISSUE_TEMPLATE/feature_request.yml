name: Feature request
description: Suggest something new or a change to how mtr.tools works
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A quick search of the open issues first helps avoid duplicates.
  - type: dropdown
    id: area
    attributes:
      label: Which part of mtr.tools?
      options:
        - Website (mtr.tools)
        - Tests and results (ping, MTR, traceroute, DNS, BGP)
        - Global Ping
        - API
        - Probes and the probe agent
        - Hosted looking glass
        - Accounts
        - Something else
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or task behind the request. This matters more than the solution.
      placeholder: I want to compare the same MTR from two probes side by side, but ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How you imagine it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you manage today?
      description: Workarounds or other tools you use for this, if any.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Examples, sketches or links.
    validations:
      required: false
